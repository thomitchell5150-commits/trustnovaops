<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | TrustNovaOps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:#050508;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
        .bg-mesh{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 20% 0%,rgba(0,229,255,0.08),transparent),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(139,92,246,0.06),transparent)}
        .bg-grid{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0.4;background-image:linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px);background-size:80px 80px}
        .content{position:relative;z-index:1;text-align:center;padding:2rem;max-width:560px}
        .error-code{font-family:'Space Mono',monospace;font-size:8rem;font-weight:700;line-height:1;background:linear-gradient(135deg,#00e5ff,#00ff9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1rem;letter-spacing:-4px}
        h1{font-size:1.75rem;font-weight:700;margin-bottom:0.75rem}
        p{color:#a0a0b0;font-size:1.05rem;line-height:1.7;margin-bottom:2rem}
        .terminal-hint{font-family:'Space Mono',monospace;font-size:0.85rem;color:#606070;background:rgba(15,15,24,0.9);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:1rem 1.5rem;margin-bottom:2rem;text-align:left;display:inline-block}
        .terminal-hint .prompt{color:#00ff9d}.terminal-hint .cmd{color:#fff}.terminal-hint .output{color:#ff3b5c}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.875rem 1.75rem;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:600;text-decoration:none;border-radius:12px;border:none;cursor:pointer;transition:all 0.25s ease;background:linear-gradient(135deg,#00e5ff,#00ff9d);color:#050508;box-shadow:0 4px 24px rgba(0,229,255,0.3)}
        .btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,229,255,0.3)}
        .logo{display:flex;align-items:center;gap:0.75rem;text-decoration:none;justify-content:center;margin-bottom:3rem}
        .logo-mark{width:38px;height:38px;background:linear-gradient(135deg,#00e5ff,#00ff9d);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-weight:700;font-size:0.9rem;color:#050508}
        .logo-text{font-weight:700;font-size:1.25rem;color:#fff}.logo-text span{color:#00e5ff}
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="bg-grid"></div>
    <div class="content">
        <a href="/" class="logo"><div class="logo-mark">TN</div><span class="logo-text">Trust<span>Nova</span>Ops</span></a>
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
        <div class="terminal-hint">
            <span class="prompt">❯</span> <span class="cmd">trustnova navigate --path unknown</span><br>
            <span class="output">✗ Route not found. Redirecting to base...</span>
        </div>
        <br><br>
        <a href="/" class="btn">← Back to TrustNovaOps</a>
    </div>
</body>
</html>
